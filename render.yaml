services:
  - type: web
    name: partidazo
    runtime: node
    plan: free
    # Mismo lugar que el servicio ya creado; Render no deja mudar la región después.
    region: virginia
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "20"
