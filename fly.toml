app = "partidazo"
primary_region = "gru"

[build]

[env]
  PORT = "3001"

[http_service]
  internal_port = 3001
  force_https = true
  # Las salas viven en memoria: una sola maquina, siempre encendida.
  auto_stop_machines = "off"
  auto_start_machines = false
  min_machines_running = 1

  [http_service.concurrency]
    type = "connections"
    soft_limit = 200
    hard_limit = 250

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
